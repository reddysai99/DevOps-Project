name: Tests

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      NODE_OPTIONS: --experimental-vm-modules
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: test
        run: npm test
        continue-on-error: true

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Parse test results
        if: always()
        id: test-results
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8')); console.log(c.total.statements.pct)")
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
            echo "has_coverage=true" >> $GITHUB_OUTPUT
          else
            echo "has_coverage=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate step summary
        if: always()
        run: |
          if [ "${{ steps.test.outcome }}" == "success" ]; then
            echo "### :white_check_mark: Tests Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### :x: Tests Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.test-results.outputs.has_coverage }}" == "true" ]; then
            echo "**Coverage**: ${{ steps.test-results.outputs.coverage }}%" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**:" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js: 20.x" >> $GITHUB_STEP_SUMMARY
          echo "- NODE_ENV: test" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage reports uploaded as artifacts (30 days retention)" >> $GITHUB_STEP_SUMMARY

      - name: Annotate test failures
        if: steps.test.outcome == 'failure'
        run: |
          echo "::error::Tests failed. Please check the test output for details."
          echo "::error::Review the uploaded coverage reports in the workflow artifacts."
          exit 1

      - name: Check test outcome
        if: steps.test.outcome == 'failure'
        run: exit 1
